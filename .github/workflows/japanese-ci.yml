name: Japanese Localization CI

on:
  push:
    branches:
      - japanese-v0.1
      - japanese-v0.2
      - japanese-v0.3
      - japanese-v0.4
      - japanese-v0.5
  pull_request:
    branches:
      - master

jobs:
  verify:
    name: Verify Japanese localization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "14"
          cache: "npm"
      - run: npm ci
      - name: Lint localization files
        run: >
          npx eslint
          src/core/localization.js
          src/core/localization-ja-content.js
          src/core/globals.js
          src/core/tabs.js
          src/components/PrimaryToggleButton.vue
          src/components/ToggleButton.vue
          src/components/OpenModalHotkeysButton.vue
          src/components/InfinityPointsHeader.vue
          src/components/EternityPointsHeader.vue
          src/components/RealityCurrencyHeader.vue
          src/components/tabs/options-visual/OptionsVisualTab.vue
          src/components/tabs/options-visual/UpdateRateSlider.vue
          src/components/tabs/options-gameplay/OptionsGameplayTab.vue
          src/components/tabs/options-saving/OptionsSavingTab.vue
          src/components/tabs/options-saving/AutosaveIntervalSlider.vue
          src/components/tabs/antimatter-dimensions/ModernAntimatterDimensionsTab.vue
          src/components/tabs/antimatter-dimensions/ClassicAntimatterDimensionsTab.vue
          src/components/tabs/antimatter-dimensions/ModernAntimatterDimensionRow.vue
          src/components/tabs/antimatter-dimensions/ClassicAntimatterDimensionRow.vue
          src/components/tabs/antimatter-dimensions/TickspeedRow.vue
          src/components/tabs/antimatter-dimensions/ModernDimensionBoostRow.vue
          src/components/tabs/antimatter-dimensions/ClassicDimensionBoostRow.vue
          src/components/tabs/antimatter-dimensions/ModernAntimatterGalaxyRow.vue
          src/components/tabs/antimatter-dimensions/ClassicAntimatterGalaxyRow.vue
          src/components/tabs/celestial-pelle/NewGame.vue
          src/components/ui-modes/BigCrunchButton.vue
          src/components/ui-modes/classic/ClassicSubtabBar.vue
          src/components/ui-modes/prestige-header/HeaderCenterContainer.vue
          src/components/ChallengeBox.vue
          src/components/ChallengeTabHeader.vue
          src/components/CostDisplay.vue
          src/components/EffectDisplay.vue
          src/components/InfinityUpgradeButton.vue
          src/components/tabs/normal-achievements/NormalAchievement.vue
          src/components/tabs/normal-achievements/NormalAchievementsTab.vue
          src/components/tabs/secret-achievements/SecretAchievement.vue
          src/components/tabs/secret-achievements/SecretAchievementTab.vue
          src/components/tabs/normal-challenges/NormalChallengeBox.vue
          src/components/tabs/normal-challenges/NormalChallengesTab.vue
          src/components/tabs/infinity-challenges/InfinityChallengeBox.vue
          src/components/tabs/infinity-challenges/InfinityChallengesTab.vue
          src/components/tabs/infinity-upgrades/InfinityUpgradesTab.vue
          src/components/tabs/infinity-upgrades/IpMultiplierButton.vue
          src/components/tabs/break-infinity/BreakInfinityButton.vue
          src/components/tabs/break-infinity/BreakInfinityTab.vue
          src/components/tabs/eternity-upgrades/EternityUpgradeButton.vue
          src/components/tabs/eternity-upgrades/EternityUpgradesTab.vue
          src/components/tabs/eternity-upgrades/EPMultiplierButton.vue
          src/components/tabs/eternity-milestones/EternityMilestoneButton.vue
          src/components/tabs/eternity-milestones/EternityMilestonesTab.vue
          src/components/tabs/eternity-challenges/EternityChallengeBox.vue
          src/components/tabs/eternity-challenges/EternityChallengeBoxWrapper.vue
          src/components/tabs/eternity-challenges/EternityChallengesTab.vue
          src/components/tabs/time-studies/NormalTimeStudy.vue
