name: Beyond CI

on:
  push:
    branches:
      - beyond-v0.1
  pull_request:
    branches:
      - master

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "14"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build:master
